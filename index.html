<html lang="en">
  <head>

    <meta name="description" content="Track your income, expenses, budgets, and debts in one place." />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/media/favicon-32x32.png" />

    <link rel="apple-touch-icon" href="/media/apple-touch-icon.png" />
    <link rel="mask-icon" href="/media/icon-512.png" color="#0b0b0f" />

    <!-- Theme / standalone display -->
    <meta name="theme-color" content="#0b0b0f" />
    <meta name="background-color" content="#0b0b0f" />
    <meta name="color-scheme" content="dark" />

    <!-- iOS standalone / PWA behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinTrack" />

    <meta name="application-name" content="FinTrack" />
    <meta name="msapplication-TileColor" content="#0b0b0f" />
    <meta name="msapplication-TileImage" content="/media/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />
    <meta property="og:title" content="FinTrack — Personal Finance Tracker" />
    <meta property="og:description" content="Track your income, expenses, budgets, and debts in one place." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/media/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FinTrack — Personal Finance Tracker" />
    <meta name="twitter:description" content="Track your income, expenses, budgets, and debts in one place." />
